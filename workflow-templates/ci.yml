name: Проверка кода
on:
  pull_request:
    paths: ["**.py", "config/**", "tests/**", "index.html", "requirements*.txt", "pyproject.toml", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["**.py", "config/**", "tests/**", "index.html", "requirements*.txt", "pyproject.toml", ".github/workflows/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Проверить опубликованные артефакты
        run: python -m vpnmy.artifacts
