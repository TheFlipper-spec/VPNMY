name: Проверка кода
on:
  pull_request:
    paths: ["**.py", "config/**", "tests/**", "index.html", "requirements*.txt", "pyproject.toml", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["**.py", "config/**", "tests/**", "index.html", "requirements*.txt", "pyproject.toml", ".github/workflows/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Проверить опубликованные артефакты
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          raw = Path("subscription.txt").read_text(encoding="utf-8")
          encoded = Path("FL1PVPN").read_text(encoding="ascii").strip()
          assert base64.b64decode(encoded, validate=True).decode("utf-8") == raw
          stats = json.loads(Path("stats.json").read_text(encoding="utf-8"))
          lines = raw.splitlines()
          links = [line for line in lines if line.startswith(("vless://", "vmess://", "trojan://"))]
          comments = [line for line in lines if line.startswith("#")]
          assert stats["total"] == len(stats["servers"]) == len(links)
          assert stats.get("subscription_metadata_lines", 0) == len(comments)
          assert len(links) == len(set(links))
          assert any(line.startswith("#profile-title:") for line in comments)
          assert all("#" in link for link in links)
          PY
