name: Обновление VPN-подписки
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["main.py", "vpnmy/**", "config/**", "scripts/install_*.py", "requirements*.txt", "pyproject.toml", "tests/**", ".github/workflows/update.yml"]
concurrency:
  group: vpn-subscription-update
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  update:
    name: Проверить узлы и опубликовать подписку
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      XRAY_VERSION: "v26.3.27"
      XRAY_SHA256_LINUX_64: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
      HYSTERIA_VERSION: "app/v2.12.2"
      HYSTERIA_SHA256_LINUX_64: "6493dfffd55b5883f64c76c63880ecc32988f0c568c9ca9014907877b4d55f94"
      VPNMY_XRAY_BIN: "${{ github.workspace }}/.cache/xray/xray"
      VPNMY_HYSTERIA_BIN: "${{ github.workspace }}/.cache/hysteria/hysteria"
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Настроить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Установить зависимости
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Проверить код
        run: |
          ruff check .
          pytest
      - name: Восстановить Xray из кэша
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/xray/xray
          key: xray-${{ runner.os }}-${{ runner.arch }}-${{ env.XRAY_VERSION }}
      - name: Восстановить Hysteria из кэша
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/hysteria/hysteria
          key: hysteria-${{ runner.os }}-${{ runner.arch }}-${{ env.HYSTERIA_VERSION }}
      - name: Установить и проверить Xray
        run: |
          if [[ ! -x "$VPNMY_XRAY_BIN" ]] || ! "$VPNMY_XRAY_BIN" version >/dev/null 2>&1; then
            rm -f -- "$VPNMY_XRAY_BIN"
            python scripts/install_xray.py --version "$XRAY_VERSION" --sha256 "$XRAY_SHA256_LINUX_64" --output "$VPNMY_XRAY_BIN"
          fi
          "$VPNMY_XRAY_BIN" version | head -n 1
      - name: Установить и проверить Hysteria
        run: |
          if [[ ! -x "$VPNMY_HYSTERIA_BIN" ]] || ! "$VPNMY_HYSTERIA_BIN" version >/dev/null 2>&1; then
            rm -f -- "$VPNMY_HYSTERIA_BIN"
            python scripts/install_hysteria.py --version "$HYSTERIA_VERSION" --sha256 "$HYSTERIA_SHA256_LINUX_64" --output "$VPNMY_HYSTERIA_BIN"
          fi
          # sed читает весь вывод, не вызывая SIGPIPE при включённом pipefail.
          "$VPNMY_HYSTERIA_BIN" version 2>&1 | sed -n '/^[[:space:]]*Version/p'
      - name: Собрать подписку
        env:
          # Только этот шаг обращается к Globalping; тесты и проверка
          # артефактов токен не видят (защита от флейвого CI).
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: python main.py
      - name: Проверить артефакты
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          encoded = Path("FL1PVPN").read_text(encoding="ascii").strip()
          raw = Path("subscription.txt").read_text(encoding="utf-8")
          stats = json.loads(Path("stats.json").read_text(encoding="utf-8"))
          lines = raw.splitlines()
          prefixes = ("vless://", "vmess://", "trojan://", "hysteria2://", "hy2://")
          links = [line for line in lines if line.startswith(prefixes)]
          assert base64.b64decode(encoded, validate=True).decode("utf-8") == raw
          assert stats["schema_version"] >= 4
          assert stats["check_mode"] == "xray"
          assert stats["verification"]["required_https_requests"] >= 2
          # Новые гарантии: 3 измерения, порог медианы, свежий Session на попытку
          assert stats["verification"]["measurements_per_node"] == 3, "ожидается 3 измерения на узел"
          assert stats["verification"]["median_threshold_ms"] == 1500
          # Российская проверка: секция всегда публикуется (enabled true/false),
          # чтобы страница статуса честно показывала, что узел проверен из РФ.
          assert "ru_check" in stats and "enabled" in stats["ru_check"], "stats должен содержать ru_check"
          assert "measurements_per_node" in stats["verification"]
          # Разнообразие: лимиты и подсети
          div = stats.get("diversity", {})
          limits = div.get("limits", {})
          assert limits.get("max_per_country") == 3
          assert limits.get("max_per_asn") == 2
          assert limits.get("max_per_ip") == 1
          assert limits.get("max_per_subnet") == 2
          assert limits.get("ipv4_subnet") == "/24"
          assert limits.get("ipv6_subnet") == "/48"
          # Качество без географии
          assert "preferred_countries_ignored" in stats.get("quality", {}), "quality должен фиксировать игнорирование preferred_countries"
          comments = [line for line in lines if line.startswith("#")]
          assert stats["total"] == len(stats["servers"]) == len(links) >= 3
          assert stats.get("subscription_metadata_lines", 0) == len(comments)
          assert len(links) == len(set(links))
          assert lines[: len(comments)] == comments
          assert any(line.startswith("#profile-title:") for line in comments)
          assert all("#" in link for link in links)
          assert all(server["verified"] and server["checks_passed"] >= 2 for server in stats["servers"])
          assert isinstance(stats.get("protocols"), dict) and stats["protocols"]
          # Убедиться что лимиты не ослаблялись молча: если узлов меньше target, это отражено в diversity/excluded
          assert "excluded_by_limits" in div or "after_selection" in div
          health = json.loads(Path("data/source_health.json").read_text(encoding="utf-8"))
          assert health["schema_version"] == 1 and isinstance(health["sources"], dict)
          print("Протоколы в подписке:", stats["protocols"])
          print(f"diversity limits OK: {limits}")
          print(f"verification: {stats['verification']}")
          PY
      - name: Опубликовать изменения
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- FL1PVPN subscription.txt stats.json data/health_history.json data/source_health.json
          if git diff --cached --quiet; then exit 0; fi
          COUNT="$(python -c 'import json; print(json.load(open("stats.json", encoding="utf-8"))["total"])')"
          git commit -m "chore(subscription): обновить ${COUNT} узлов"
          git pull --rebase origin main
          git push origin HEAD:main
