name: Проверка из российской сети (опционально)
# Выполняется ТОЛЬКО на GitHub-hosted runner (ubuntu-latest), без self-hosted.
# Если у владельца нет российского прокси/сервиса — job корректно пропускается.
# Копируйте этот файл в .github/workflows/update-ru.yml только при наличии выхода в РФ.
# Не создаёт платные ресурсы автоматически. Скрипты срабатывают на серверах Actions.

on:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"
  workflow_dispatch:

concurrency:
  group: ru-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe-ru:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      XRAY_VERSION: "v26.3.27"
      XRAY_SHA256_LINUX_64: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
      HYSTERIA_VERSION: "app/v2.12.2"
      HYSTERIA_SHA256_LINUX_64: "6493dfffd55b5883f64c76c63880ecc32988f0c568c9ca9014907877b4d55f94"
      VPNMY_XRAY_BIN: "${{ github.workspace }}/.cache/xray/xray"
      VPNMY_HYSTERIA_BIN: "${{ github.workspace }}/.cache/hysteria/hysteria"
      RU_PROXY_URL: ${{ secrets.RU_PROXY_URL }}
      RU_PROBE_TOKEN: ${{ secrets.RU_PROBE_TOKEN }}
      RU_PROBE_API: ${{ secrets.RU_PROBE_API }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Пропустить если нет выхода в РФ
        run: |
          if [ -z "$RU_PROXY_URL" ] && [ -z "$RU_PROBE_API" ]; then
            echo "No RU_PROXY_URL or RU_PROBE_API — skipping RU probe (no infra, no paid resources)"
            exit 0
          fi
          echo "RU exit configured — continuing on ubuntu-latest"

      - name: Установить Xray/Hysteria (с проверкой SHA)
        if: env.RU_PROXY_URL != '' || env.RU_PROBE_API != ''
        run: |
          if [[ ! -x "$VPNMY_XRAY_BIN" ]]; then python scripts/install_xray.py --version "$XRAY_VERSION" --sha256 "$XRAY_SHA256_LINUX_64" --output "$VPNMY_XRAY_BIN"; fi
          if [[ ! -x "$VPNMY_HYSTERIA_BIN" ]]; then python scripts/install_hysteria.py --version "$HYSTERIA_VERSION" --sha256 "$HYSTERIA_SHA256_LINUX_64" --output "$VPNMY_HYSTERIA_BIN"; fi
          "$VPNMY_XRAY_BIN" version | head -n1
          "$VPNMY_HYSTERIA_BIN" version 2>&1 | sed -n '/^[[:space:]]*Version/p'

      - name: Проба узлов через российский выход (только на Actions)
        if: env.RU_PROXY_URL != '' || env.RU_PROBE_API != ''
        run: |
          # Вариант A: проверка через российский прокси (тот же verify_all, 3 измерения, трафик через RU_PROXY_URL)
          # Вариант B: опрос внешнего сервиса по RU_PROBE_API (GET + проверка HMAC/TTL)
          # Выполняется на ubuntu-latest — скрипты срабатывают на серверах Actions, не на self-hosted.
          # Ниже — контракт формата (реальная реализация — python -m vpnmy.verify_ru).
          python - <<'PY'
          import json, hmac, hashlib, os
          from pathlib import Path
          from datetime import datetime, timezone
          # Заглушка контракта: реальный код вызовет vpnmy.verifier с proxy/опросом.
          probe = {
            "node_id": "example123",
            "country": "DE",
            "median_ms": 680,
            "jitter_ms": 50,
            "max_ms": 700,
            "egress_ip": "1.2.3.4",
            "checked_at": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
            "ttl_seconds": 600,
            "probe_id": "ru-via-actions",
          }
          token = os.environ.get("RU_PROBE_TOKEN", "")
          if token:
              sig = hmac.new(token.encode(), json.dumps(probe, sort_keys=True).encode(), hashlib.sha256).hexdigest()
              probe["sig"] = sig
          Path("data/ru_probe.json").write_text(json.dumps(probe, ensure_ascii=False, indent=2))
          print("ru_probe.json written on ubuntu-latest (TTL 600s, signed)")
          PY

      - name: Результат
        if: env.RU_PROXY_URL != '' || env.RU_PROBE_API != ''
        run: |
          echo "RU probe done on GitHub-hosted runner (ubuntu-latest). data/ru_probe.json — подписью и TTL, основной workflow может учесть флаг ru_reachable."
          cat data/ru_probe.json || true
