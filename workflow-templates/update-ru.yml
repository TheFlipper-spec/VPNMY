name: Проверка из российской сети (опционально)
# Требуется self-hosted runner с лейблом `ru` в сети РФ.
# Без такого runner workflow пропускается (continue-on-error в основном update.yml).
# Копируйте этот файл в .github/workflows/update-ru.yml только если инфраструктура есть.
# Не создаёт платные ресурсы автоматически.

on:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"
  workflow_dispatch:

concurrency:
  group: ru-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe-ru:
    runs-on: [self-hosted, ru]
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      XRAY_VERSION: "v26.3.27"
      XRAY_SHA256_LINUX_64: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
      HYSTERIA_VERSION: "app/v2.12.2"
      HYSTERIA_SHA256_LINUX_64: "6493dfffd55b5883f64c76c63880ecc32988f0c568c9ca9014907877b4d55f94"
      VPNMY_XRAY_BIN: "${{ github.workspace }}/.cache/xray/xray"
      VPNMY_HYSTERIA_BIN: "${{ github.workspace }}/.cache/hysteria/hysteria"
      RU_PROBE_TOKEN: ${{ secrets.RU_PROBE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Установить Xray/Hysteria (с проверкой SHA)
        run: |
          if [[ ! -x "$VPNMY_XRAY_BIN" ]]; then python scripts/install_xray.py --version "$XRAY_VERSION" --sha256 "$XRAY_SHA256_LINUX_64" --output "$VPNMY_XRAY_BIN"; fi
          if [[ ! -x "$VPNMY_HYSTERIA_BIN" ]]; then python scripts/install_hysteria.py --version "$HYSTERIA_VERSION" --sha256 "$HYSTERIA_SHA256_LINUX_64" --output "$VPNMY_HYSTERIA_BIN"; fi
          "$VPNMY_XRAY_BIN" version | head -n1
          "$VPNMY_HYSTERIA_BIN" version 2>&1 | sed -n '/^[[:space:]]*Version/p'
      - name: Проба узлов (только IP, без секретов)
        run: |
          # Пример: запускает ту же логику verify_all на выборке из data/health_history.json
          # и публикует data/ru_probe.json с подписью (node_id, median_ms, jitter, checked_at, ttl).
          # Не отправляет URI/пароли/UUID наружу.
          python - <<'PY'
          import json, hmac, hashlib, os, time
          from pathlib import Path
          # Заглушка: реальная реализация должна вызывать vpnmy.verifier на том же списке кандидатов.
          # Здесь только формат обмена, чтобы показать контракт.
          probe = {
            "node_id": "example123",
            "median_ms": 680,
            "jitter_ms": 50,
            "max_ms": 700,
            "checked_at": "2026-09-15T12:00:00Z",
            "ttl_seconds": 600,
            "probe_id": "ru-runner-1",
          }
          token = os.environ.get("RU_PROBE_TOKEN", "")
          if token:
              sig = hmac.new(token.encode(), json.dumps(probe, sort_keys=True).encode(), hashlib.sha256).hexdigest()
              probe["sig"] = sig
          Path("data/ru_probe.json").write_text(json.dumps(probe, ensure_ascii=False, indent=2))
          print("ru_probe.json stub written")
          PY
      - name: Загрузить результат (если нужен агрегатор)
        run: |
          echo "Результат ru-пробы — data/ru_probe.json (с подписью, TTL 600с). Основной workflow может его учесть как дополнительный флаг."
