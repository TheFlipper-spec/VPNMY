name: Update VPN Subscription

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache Xray and MMDB
      id: cache-files
      uses: actions/cache@v4
      with:
        path: |
          xray
          Country.mmdb
        key: vpn-tools-v1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt PySocks

    - name: Setup Tools (Xray)
      if: steps.cache-files.outputs.cache-hit != 'true'
      run: |
        if [ ! -f xray ]; then
          echo "Downloading Xray..."
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o Xray-linux-64.zip xray
          rm Xray-linux-64.zip
        fi

    - name: Ensure Xray permissions
      run: |
        if [ -f xray ]; then chmod +x xray; fi

    - name: Run script
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      run: python main.py

    - name: Commit and push changes
      run: |
        # Настройка окружения
        export HOME=/tmp
        git config --global --add safe.directory '*'
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # ВАЖНОЕ ИСПРАВЛЕНИЕ:
        # Используем "git add .", чтобы добавить ВСЕ измененные файлы,
        # включая history.json, FL1PVPN и stats.json
        git add . || true
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update VPN configs [skip ci]"
          
          # Притягиваем изменения с сервера, отдавая приоритет нашим новым файлам
          git pull --rebase -Xtheirs origin main
          
          git push
        fi
