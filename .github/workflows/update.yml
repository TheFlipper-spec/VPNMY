name: Update VPN Subscription

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час (в 00 минут)
  workflow_dispatch:      # Ручной запуск кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем запись в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю для корректного rebase

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Xray Core
        run: |
          # Используем стабильную версию 1.8.4
          wget -q https://github.com/XTLS/Xray-core/releases/download/v1.8.4/Xray-linux-64.zip
          unzip -o -q Xray-linux-64.zip xray geoip.dat geosite.dat
          chmod +x xray
          rm Xray-linux-64.zip

      - name: Run VPN Scanner (Main Script)
        run: python main.py

      - name: Prepare logs
        run: |
          mkdir -p logs
          if [ -f vpn_scanner.log ]; then
            cp vpn_scanner.log "logs/last_scan_$(date -u +%Y%m%d_%H%M%S).log"
            cp vpn_scanner.log logs/latest.log
            # Оставляем только 20 последних логов
            cd logs && ls -t last_scan_*.log | tail -n +21 | xargs -r rm --
          fi

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Добавляем важные файлы (включая reserve_pool.json!)
          git add FL1PVPN stats.json history.json reserve_pool.json
          
          # 2. Добавляем логи
          git add logs/*.log 2>/dev/null || true
          
          # 3. Проверяем статус
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 4. Создаем коммит
          COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "?")
          git commit -m "🚀 Update $COUNT Servers | $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # 🔥 ВАЖНОЕ ИСПРАВЛЕНИЕ: Прячем любые незакоммиченные файлы (мусор),
          # которые могли появиться в последнюю секунду, чтобы rebase прошел успешно.
          git stash
          
          # 5. СТРАТЕГИЯ ОТ КОНФЛИКТОВ (Rebase)
          # Скачиваем изменения (от Watchdog) и накладываем свои сверху
          # Используем стратегию 'theirs' (наши изменения имеют приоритет над старыми данными с сервера)
          git pull --rebase --strategy-option=theirs origin main
          
          # 6. Отправляем
          git push origin main
