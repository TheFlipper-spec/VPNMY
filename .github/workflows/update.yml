name: Update VPN Subscription

on:
  schedule:
    - cron: '*/10 * * * *' # Запуск каждые 10 минут
  workflow_dispatch:       # Ручной запуск кнопкой

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      # 1. ЛЕЧИМ ОШИБКУ GIT (Добавлено это действие)
      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run VPN Scanner (Main Script)
        run: python main.py

      - name: Prepare logs
        run: |
          mkdir -p logs
          if [ -f vpn_scanner.log ]; then
            cp vpn_scanner.log "logs/last_scan_$(date -u +%Y%m%d_%H%M%S).log"
            cp vpn_scanner.log logs/latest.log
            # Оставляем только 20 последних логов
            cd logs && ls -t last_scan_*.log | tail -n +21 | xargs -r rm --
          fi

      - name: Commit and Push changes
        run: |
          # Используем global настройки, так как local может снова вызвать ошибку прав
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 1. Добавляем файлы
          git add FL1PVPN stats.json history.json reserve_pool.json
          
          # 2. Добавляем логи
          git add logs/*.log 2>/dev/null || true
          
          # 3. Проверяем изменения
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # 4. Коммит
          COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "?")
          git commit -m "🚀 Update $COUNT Servers | $(date -u +'%Y-%m-%d %H:%M UTC')"
          
          # 5. СТРАТЕГИЯ
          git stash
          git pull --rebase --strategy-option=theirs origin main
          
          # 6. Push
          git push origin main
