name: Update VPN Configs

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час (в 00 минут)
  workflow_dispatch: # Возможность запустить кнопку вручную

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Права нужны для коммита файлов обратно в репо
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Скачиваем только последний коммит для скорости

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Кэшируем пакеты для ускорения

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 PySocks

      - name: Run VPN Parser Script
        env:
          # ВАЖНО: Мы берем твой секрет "TOKEN" и кладем его в переменную "GITHUB_TOKEN",
          # которую ищет скрипт main.py (os.environ.get("GITHUB_TOKEN"))
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Добавляем только нужные файлы
          git add FL1PVPN stats.json
          
          # Проверяем, есть ли изменения перед коммитом
          if git diff --staged --quiet; then
            echo "Changes not detected. Skipping commit."
          else
            git commit -m "🚀 Auto-update: $(date -u)"
            git push
          fi
