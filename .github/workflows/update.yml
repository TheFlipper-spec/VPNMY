name: Update VPN Configs

on:
  schedule:
    - cron: '0 * * * *'  # Запуск каждый час
  workflow_dispatch:      # Возможность запуска вручную

jobs:
  build:
    runs-on: self-hosted  # ВАЖНО: Запуск на твоем VPS
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 PySocks

      - name: Update Xray Core
        run: |
          # Скачиваем свежее ядро Xray для поддержки новых протоколов
          echo "⬇️ Updating Xray Core..."
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -q xray.zip xray geoip.dat geosite.dat
          rm xray.zip
          chmod +x xray
          ./xray -version

      - name: Run VPN Parser Script
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Добавляем только нужные файлы
          git add FL1PVPN stats.json history.json
          
          if git diff --staged --quiet; then
            echo "Changes not detected. Skipping commit."
          else
            git commit -m "🚀 Auto-update: $(date -u)"
            
            # --- ИСПРАВЛЕНИЕ: Сбрасываем изменения в xray/geoip перед pull ---
            # Это удалит изменения в бинарниках, которые мы не хотим коммитить,
            # и сделает рабочую директорию чистой для rebase.
            git reset --hard
            
            # Забираем изменения с сервера
            git pull --rebase origin main
            
            git push
          fi
