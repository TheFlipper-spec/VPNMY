name: Update VPN Configs

on:
  schedule:
    - cron: '*/20 * * * *'  # Запуск каждые 20 минут
  workflow_dispatch:        # Возможность запуска кнопкой вручную

jobs:
  build:
    runs-on: self-hosted    # Работает на твоем сервере (VPS)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 PySocks

      - name: Update Xray Core
        run: |
          # 1. Устанавливаем unzip (если вдруг нет), игнорируем ошибки установки
          sudo apt-get update && sudo apt-get install -y unzip || true
          
          # 2. Скачиваем свежее ядро Xray
          echo "⬇️ Downloading Xray..."
          wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          
          # 3. Распаковываем только нужное
          unzip -o -q xray.zip xray geoip.dat geosite.dat
          
          # 4. Чистим и даем права
          rm xray.zip
          chmod +x xray

      - name: Run VPN Parser Script
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # Запускаем скрипт
          python main.py
          
          # Показываем последние 50 строк лога в консоли GitHub Actions
          echo "📄 Last 50 lines of log:"
          tail -n 50 vpn_scanner.log || echo "Log file not found"

      - name: Prepare logs for commit
        run: |
          # Создаем папку для логов если её нет
          mkdir -p logs
          
          # Копируем лог с временной меткой
          if [ -f vpn_scanner.log ]; then
            # Сохраняем последний лог с датой
            cp vpn_scanner.log "logs/last_scan_$(date -u +%Y%m%d_%H%M%S).log"
            
            # Также сохраняем как latest.log для быстрого доступа
            cp vpn_scanner.log logs/latest.log
            
            # Оставляем только последние 10 логов (чистим старые)
            cd logs
            ls -t *.log | tail -n +11 | xargs -r rm
            cd ..
          fi

      - name: Commit and Push Changes
        run: |
          # Настраиваем Git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # ⚠️ ВАЖНО: Сначала чистим рабочую директорию от мусора
          rm -f xray geoip.dat geosite.dat vpn_scanner.log *.zip *.tmp *.json.tmp 2>/dev/null || true
          
          # Добавляем файлы результатов И логи
          git add FL1PVPN stats.json history.json
          git add logs/*.log 2>/dev/null || true
          
          # Проверяем, есть ли что коммитить
          if git diff --staged --quiet; then
            echo "No changes in subscription. Skipping commit."
          else
            # Получаем статистику из stats.json
            if [ -f stats.json ]; then
              SERVER_COUNT=$(python -c "import json; data=json.load(open('stats.json')); print(len(data.get('servers', [])))" 2>/dev/null || echo "4")
            else
              SERVER_COUNT="4"
            fi
            
            # Коммитим изменения
            git commit -m "🚀 Update $SERVER_COUNT Servers | $(date -u '+%Y-%m-%d %H:%M UTC')"
            
            # ⚠️ ИСПРАВЛЕНИЕ: Используем stash для сохранения локальных изменений
            # Сохраняем все незакоммиченные изменения
            git stash save "Temporary stash before pull"
            
            # Теперь безопасно делаем pull с rebase
            git pull --rebase origin main
            
            # Пушим изменения
            git push
            
            # Очищаем stash (если он остался)
            git stash drop 2>/dev/null || true
          fi

      - name: Final cleanup
        if: always()
        run: |
          # Финальная очистка временных файлов
          rm -f xray geoip.dat geosite.dat vpn_scanner.log *.zip *.tmp *.json.tmp 2>/dev/null || true
          
          # Сбрасываем все незакоммиченные изменения на всякий случай
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          
          # Показываем размер папки с логами
          if [ -d logs ]; then
            echo "📊 Logs folder size: $(du -sh logs | cut -f1)"
            echo "📊 Number of logs: $(ls -1 logs/*.log 2>/dev/null | wc -l)"
          fi
