name: Watchdog Health Check

on:
  schedule:
    - cron: '5,12,19,26,33,40,47,54 * * * *'  # Автоматический запуск каждые ~7 минут
  workflow_dispatch:                          # 🔥 ЭТА СТРОКА ДОБАВЛЯЕТ КНОПКУ РУЧНОГО ЗАПУСКА

concurrency:
  group: vpn-update
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check main.py execution
        run: |
          # Если основной скрипт обновления работает, watchdog должен ждать
          if pgrep -f "main.py" > /dev/null; then
            echo "⏳ main.py is currently running. Skipping watchdog scan."
            exit 0
          fi

      - name: Kill zombie processes
        run: pkill -9 -f "xray" || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужна история для rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PySocks

      - name: Install Xray Core (v1.8.4)
        run: |
          # Используем ту же версию, что и в основном скрипте (1.8.4), для совместимости
          if [ ! -f xray ]; then
            echo "⬇️ Downloading Xray 1.8.4..."
            wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/download/v1.8.4/Xray-linux-64.zip
            unzip -o -q xray.zip xray geoip.dat geosite.dat
            rm -f xray.zip
          fi
          chmod +x xray

      - name: Run Watchdog Script
        timeout-minutes: 3
        run: python watchdog.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Добавляем файлы, которые мог изменить Watchdog
          git add FL1PVPN stats.json reserve_pool.json logs/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ No rotation needed. Everything is healthy."
          else
            echo "🔄 Servers rotated. Pushing changes..."
            git commit -m "🐕 Watchdog Rotation | $(date -u '+%H:%M UTC')"
            
            # --- ЗАЩИТА ОТ КОНФЛИКТОВ (GIT STASH + REBASE) ---
            
            # 1. Прячем наши коммиты во временное хранилище, если вдруг что-то изменилось удаленно
            git stash save "Watchdog Stash" 2>/dev/null || true
            
            # 2. Скачиваем обновления с сервера (rebase накладывает их "под" наши)
            git pull --rebase origin main
            
            # 3. Возвращаем наши изменения (если stash что-то спрятал)
            git stash pop 2>/dev/null || true
            
            # 4. Отправляем изменения обратно
            git push origin main
          fi

      - name: Final cleanup
        if: always()
        run: |
          pkill -9 -f "xray" || true
          rm -f *.zip *.tmp *.json.tmp 2>/dev/null || true
