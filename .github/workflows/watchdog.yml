name: Watchdog Health Check

on:
  schedule:
    - cron: '*/7 * * * *'  # Каждые 7 минут
  workflow_dispatch:

jobs:
  health-check:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests PySocks

      - name: Download Xray (if needed)
        run: |
          if [ ! -f xray ]; then
            wget -q -O xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -o -q xray.zip xray
            rm -f xray.zip
          fi
          chmod +x xray

      - name: Run Watchdog
        run: python watchdog.py

      - name: Prepare logs
        run: |
          mkdir -p logs
          if [ -f watchdog.log ]; then
            cp watchdog.log logs/latest_watchdog.log
          fi

      - name: Cleanup
        run: rm -f watchdog.log *.zip *.tmp

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add FL1PVPN stats.json reserve_pool.json 2>/dev/null || true
          git add logs/latest_watchdog.log 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ No changes needed"
          else
            git commit -m "🐕 Watchdog: health check at $(date -u '+%H:%M UTC')"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Final cleanup
        if: always()
        run: rm -f xray *.zip *.tmp
