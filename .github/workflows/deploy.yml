name: Deploy Project to VPS

# Сценарий запускается автоматически при каждом push в ветку main (или master)
on:
  push:
    branches:
      - main  # Если ваша главная ветка называется master, замените main на master

jobs:
  deploy:
    # Указываем запускать именно на вашем self-hosted сервере
    runs-on: self-hosted

    steps:
      # Шаг 1: Автоматическое скачивание актуального кода в папку _work
      - name: Check out repository code
        uses: actions/checkout@v4

      # Шаг 2: Здесь вы можете прописать команды для запуска вашего VPN-проекта
      - name: Run deploy scripts
        run: |
          echo "Код успешно скачан на сервер!"
          ls -la
          # Сюда в будущем вы добавите команды запуска, например:
          # docker-compose up -d --build или python3 main.py
