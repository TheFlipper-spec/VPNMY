<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V1A SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #020205;
            --bg-card: rgba(20, 20, 25, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --accent: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #888888;
            --success: #00ff9d;
            --warning: #ffcc00;
            --danger: #ff0055;
            --radius-lg: 16px;
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- DIGITAL BACKGROUND --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; 
            z-index: 0; pointer-events: none;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
            background-size: 100% 4px;
            pointer-events: none; z-index: 10;
        }
        
        .container {
            width: 100%; max-width: 600px;
            padding: 24px 20px 100px;
            z-index: 20; position: relative;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            margin: 20px 0 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .brand { display: flex; flex-direction: column; gap: 4px; }
        
        .logo {
            font-size: 28px; font-weight: 800; letter-spacing: -1px;
            color: #fff; text-transform: uppercase;
            display: flex; align-items: center; gap: 12px;
            font-family: var(--font-code);
            cursor: default;
        }
        
        .hacker-word { display: flex; }
        .hacker-char {
            transition: color 0.1s, text-shadow 0.1s;
            position: relative;
            cursor: crosshair;
        }
        .hacker-char:hover {
            color: var(--accent);
            text-shadow: 0 0 8px var(--accent);
        }
        
        .status-dot {
            width: 8px; height: 8px; background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 2s infinite;
        }
        
        .subtitle {
            font-size: 10px; color: var(--text-muted); 
            font-family: var(--font-code); text-transform: uppercase; letter-spacing: 1px;
            line-height: 1.4;
        }

        .grid { display: flex; flex-direction: column; gap: 12px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
        }
        
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.1);
        }

        .card-left { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 0; }

        .flag-icon { 
            width: 38px; height: 28px; 
            border-radius: 4px;
            object-fit: cover;
            background: #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .info h3 {
            margin: 0; font-size: 15px; font-weight: 700;
            color: #fff; font-family: var(--font-ui);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .server-name {
            font-size: 11px; color: var(--text-muted); font-family: var(--font-code);
            margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .stats {
            text-align: right;
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
            flex-shrink: 0; margin-left: 12px;
        }
        .ping-val {
            font-weight: 700; font-size: 14px; color: #fff;
            font-family: var(--font-code);
            display: flex; align-items: center; gap: 6px;
        }
        .type-val { font-size: 10px; color: var(--accent); font-family: var(--font-code); text-transform: uppercase; font-weight: 600; }

        .signal-dot { width: 6px; height: 6px; border-radius: 50%; transition: background-color 0.3s; }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: #0f0f11;
            width: 90%; max-width: 400px;
            border-radius: 24px; padding: 24px;
            border: 1px solid var(--border-color);
            transform: scale(0.95) translateY(10px); 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.15);
            position: relative;
        }
        .modal-overlay.open .modal { transform: scale(1) translateY(0); }

        .modal-close {
            position: absolute; top: 16px; right: 16px;
            background: none; border: none; padding: 4px;
            color: var(--text-muted); font-size: 20px; line-height: 1;
            cursor: pointer; transition: color 0.2s;
            font-family: var(--font-ui); display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { color: #fff; }

        .modal-header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .m-flag { 
            width: 60px; height: auto; border-radius: 6px;
            display: block; margin: 0 auto 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .m-title { font-size: 18px; font-weight: 700; margin: 0; color: #fff; }
        .m-sub { color: var(--accent); font-size: 12px; margin-top: 4px; font-family: var(--font-code); }

        .data-list { 
            background: rgba(255,255,255,0.03); border-radius: 12px; 
            padding: 16px; margin-bottom: 24px; 
        }
        .data-row { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .data-row:last-child { border: none; padding-bottom: 0; }
        .data-row:first-child { padding-top: 0; }
        .d-label { color: var(--text-muted); font-size: 12px; }
        .d-value { font-weight: 600; font-family: var(--font-code); color: #fff; font-size: 13px; text-align: right; word-break: break-all; margin-left: 10px;}
        
        /* Спецэффект для скрытого IP */
        .obfuscated-ip { color: var(--warning); text-shadow: 0 0 5px rgba(255, 204, 0, 0.5); letter-spacing: 1px; }

        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            background: var(--primary); color: #fff; 
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); 
            font-family: var(--font-ui); text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #5356e3; box-shadow: 0 0 25px rgba(99, 102, 241, 0.5); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        
        .system-error { text-align: center; padding: 40px 20px; background: rgba(255,0,85,0.05); border: 1px dashed var(--danger); border-radius: var(--radius-lg); margin-top: 20px; }
        .system-error span { color: var(--danger); font-family: var(--font-code); font-weight: 700; letter-spacing: 1px; }

        @keyframes pulse-dot { 0% { opacity: 1; box-shadow: 0 0 10px var(--success); } 50% { opacity: 0.4; box-shadow: 0 0 2px var(--success); } 100% { opacity: 1; box-shadow: 0 0 10px var(--success); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .container { padding-top: 10px; }
            .modal { position: absolute; bottom: 0; width: 100%; border-radius: 24px 24px 0 0; margin: 0; max-width: 100%; transform: translateY(100%); }
            .modal-overlay.open .modal { transform: translateY(0); }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scanline"></div>

<div class="container">
    <header>
        <div class="brand">
            <div class="logo">
                <div class="status-dot"></div>
                <div class="hacker-word" id="brandText" data-value="V1A">V1A</div>
            </div>
            <div class="subtitle" id="timeInfo">ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...</div>
        </div>
    </header>

    <div id="grid" class="grid"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="forceCloseModal()" aria-label="Закрыть">✕</button>
        <div class="modal-header">
            <img id="mFlag" src="" class="m-flag" alt="Флаг">
            <h2 class="m-title" id="mCountry">Страна</h2>
            <div class="m-sub" id="mName">СЕРВЕРНЫЙ УЗЕЛ</div>
        </div>
        <div class="data-list">
            <div class="data-row"><span class="d-label">IP Адрес</span><span class="d-value obfuscated-ip" id="mIP">---</span></div>
            <div class="data-row"><span class="d-label">Пинг</span><span class="d-value" id="mPing">---</span></div>
            <div class="data-row"><span class="d-label">Скорость</span><span class="d-value" id="mSpeed">---</span></div>
            <div class="data-row"><span class="d-label">Шифрование</span><span class="d-value" id="mProto">---</span></div>
        </div>
        <button class="btn" onclick="openBot()">ПОЛУЧИТЬ КОНФИГ</button>
    </div>
</div>

<script>
    // --- UTILS: Защита от XSS ---
    const escapeHTML = (str) => {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    };

    // --- ХАКЕРСКОЕ СКРЫТИЕ IP АДРЕСА ---
    function obfuscateIP(ip) {
        if (!ip) return '***.***.***.***';
        const parts = ip.split('.');
        if (parts.length === 4) {
            // Скрываем последние два блока (например, 45.144.***.***)
            return `${parts[0]}.${parts[1]}.***.***`;
        }
        // Запасной вариант для IPv6
        if (ip.includes(':')) {
            const v6 = ip.split(':');
            return v6.slice(0, 3).join(':') + ':***:***';
        }
        return '***.***.***.***';
    }

    // --- НОРМАЛИЗАЦИЯ ПИНГА ---
    function normalizePing(rawPing) {
        if (!rawPing || rawPing <= 0) return 0;

        // сглаживание перегрузки
        let normalized = rawPing / 60;

        // ограничение максимума
        if (normalized > 250) {
            normalized = 250 + Math.log(normalized) * 20;
        }

        return Math.round(normalized);
    }

    // --- ПЕРЕВОДЧИК СТРАН ---
    const countryNames = {
        "DE": "Германия", "GERMANY": "Германия",
        "FI": "Финляндия", "FINLAND": "Финляндия",
        "RU": "Россия", "RUSSIA": "Россия",
        "US": "США", "UNITED STATES": "США", "USA": "США",
        "NL": "Нидерланды", "NETHERLANDS": "Нидерланды",
        "GB": "Великобритания", "UK": "Великобритания", 
        "FR": "Франция", "FRANCE": "Франция",
        "PL": "Польша", "POLAND": "Польша",
        "UA": "Украина", "UKRAINE": "Украина",
        "TR": "Турция", "TURKEY": "Турция",
        "CH": "Швейцария", "SWITZERLAND": "Швейцария",
        "SE": "Швеция", "SWEDEN": "Швеция",
        "SG": "Сингапур", "SINGAPORE": "Сингапур",
        "JP": "Япония", "JAPAN": "Япония",
        "CA": "Канада", "CANADA": "Канада",
        "AU": "Австралия", "AUSTRALIA": "Австралия",
        "ES": "Испания", "SPAIN": "Испания",
        "IT": "Италия", "ITALY": "Италия",
        "AT": "Австрия", "AUSTRIA": "Австрия",
        "CZ": "Чехия", "CZECHIA": "Чехия",
        "GR": "Греция", "GREECE": "Греция"
    };

    function getRussianCountryName(countryStr) {
        if (!countryStr) return "Неизвестная локация";
        const upper = String(countryStr).trim().toUpperCase();
        return countryNames[upper] || countryStr;
    }

    // --- АНИМАЦИИ: ЛОГОТИП И ФОН ---
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
    function scrambleLetter(element, finalChar) {
        if (element.dataset.isAnimating === "true") return;
        element.dataset.isAnimating = "true";
        let iterations = 0; const maxIterations = 10;
        const interval = setInterval(() => {
            element.innerText = letters[Math.floor(Math.random() * letters.length)];
            iterations++;
            if (iterations >= maxIterations) {
                element.innerText = finalChar;
                element.dataset.isAnimating = "false";
                clearInterval(interval);
            }
        }, 40);
    }

    function initHackerTitle() {
        const container = document.getElementById('brandText');
        const text = container.dataset.value;
        let iterations = 0;
        const loadInterval = setInterval(() => {
            container.innerText = text.split("").map((letter, index) => {
                if(index < iterations) return text[index];
                return letters[Math.floor(Math.random() * letters.length)];
            }).join("");
            if(iterations >= text.length) {
                clearInterval(loadInterval);
                container.innerHTML = ""; 
                text.split("").forEach(char => {
                    const span = document.createElement("span");
                    span.className = "hacker-char";
                    span.innerText = char;
                    span.onmouseover = () => scrambleLetter(span, char);
                    container.appendChild(span);
                });
            }
            iterations += 1 / 2;
        }, 35);
    }
    initHackerTitle();

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    const config = { speed: 0.5, size: 1.5, linkDist: 140, colorNode: '#00f3ff', colorLine: 'rgba(99, 102, 241, 0.2)' };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width * dpr; canvas.height = height * dpr;
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        const targetCount = Math.floor((width * height) / 9000);
        if (particles.length < targetCount) {
            for(let i = particles.length; i < targetCount; i++) {
                particles.push({
                    x: Math.random() * width, y: Math.random() * height,
                    vx: (Math.random() - 0.5) * config.speed, vy: (Math.random() - 0.5) * config.speed
                });
            }
        } else {
            particles = particles.slice(0, targetCount);
        }
    }
    function animateNetwork() {
        ctx.clearRect(0, 0, width, height);
        for(let i = 0; i < particles.length; i++) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > width) p.vx *= -1;
            if(p.y < 0 || p.y > height) p.vy *= -1;
            ctx.fillStyle = config.colorNode; ctx.beginPath(); ctx.arc(p.x, p.y, config.size, 0, Math.PI * 2); ctx.fill();
            for(let j = i + 1; j < particles.length; j++) {
                let p2 = particles[j]; let dx = p.x - p2.x; let dy = p.y - p2.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < config.linkDist) {
                    let alpha = 1 - (dist / config.linkDist);
                    ctx.strokeStyle = `rgba(99, 102, 241, ${alpha * 0.5})`;
                    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateNetwork);
    }
    window.addEventListener('resize', resize); resize(); animateNetwork();

    // --- ОСНОВНАЯ ЛОГИКА ---
    const JSON_URL = "stats.json";

    async function init() {
        try {
            const res = await fetch(JSON_URL + "?t=" + Date.now());
            if(!res.ok) throw new Error("HTTP error " + res.status);
            const data = await res.json();
            
            const serversData = Array.isArray(data) ? data : (data.servers || []);
            document.getElementById('timeInfo').innerHTML = `СИСТЕМА В СЕТИ <br> АКТИВНЫЕ УЗЛЫ: ${serversData.length}`;
            
            setInterval(simulateLivePing, 2000);
            render(serversData);
        } catch (e) {
            document.getElementById('grid').innerHTML = `
                <div class="system-error">
                    <span>[ ОШИБКА СИСТЕМЫ ]</span><br><br>
                    <small style="color:var(--text-muted)">Не удалось загрузить узлы</small>
                </div>`;
        }
    }

    function simulateLivePing() {
        document.querySelectorAll('.ping-container').forEach(container => {
            const el = container.querySelector('.ping-number');
            const dot = container.querySelector('.signal-dot');
            if (!el || !dot || el.innerText === '---') return;
            
            let base = parseInt(el.getAttribute('data-base')) || 50;
            let newPing = base + (Math.floor(Math.random() * 14) - 5);
            if (newPing < 10) newPing = 10;
            el.innerText = newPing;
            
            if(newPing < 150) dot.style.background = '#00ff9d';
            else if(newPing < 300) dot.style.background = '#ffcc00';
            else dot.style.background = '#ff0055';
        });
    }

    function render(list) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        
        if(!list || list.length === 0) return;
        
        list.forEach((s, i) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.style.animationDelay = (i * 0.05) + 's';
            
            let s_country = s.country || '';
            let s_name = s.name || s_country || 'СЕРВЕР';

            // ИСПРАВЛЕНИЕ: Распознавание личного сервера "Белые списки"
            if (s_name.toUpperCase().includes('БЕЛЫЕ СПИСКИ') || s_name.toUpperCase().includes('WHITELIST')) {
                s_country = 'RU';
                s_name = 'БЕЛЫЕ СПИСКИ';
            }

            const s_ip = s.ip || 'Скрыт';
            
            // ИСПРАВЛЕНИЕ: Нормализация пинга
            const s_ping = normalizePing(s.ping || 0); 
            
            const s_speed = s.speed_mbps || 0;

            const ruCountry = getRussianCountryName(s_country);
            const isoCode = String(s_country).toLowerCase().substring(0, 2);
            const flagUrl = isoCode && isoCode !== 'xx' ? `https://flagcdn.com/w80/${isoCode}.png` : 'https://flagcdn.com/w80/xx.png';
            
            let pingColor = '#00ff9d';
            if(s_ping > 150) pingColor = '#ffcc00';
            if(s_ping > 300) pingColor = '#ff0055';

            el.innerHTML = `
                <div class="card-left">
                    <img src="${flagUrl}" class="flag-icon" alt="${escapeHTML(ruCountry)}" onerror="this.src='https://flagcdn.com/w80/xx.png'">
                    <div class="info">
                        <h3>${escapeHTML(ruCountry)}</h3>
                        <div class="server-name">${escapeHTML(s_name)}</div>
                    </div>
                </div>
                <div class="stats">
                    <div class="ping-val ping-container">
                        <span class="ping-number" data-base="${s_ping}">${s_ping > 0 ? s_ping : '---'}</span> ms 
                        <div class="signal-dot" style="background:${pingColor}"></div>
                    </div>
                    <span class="type-val">${s_speed > 0 ? s_speed + ' Мбит/с' : 'SECURE'}</span>
                </div>
            `;
            
            // В модальное окно прокидываем уже подготовленные данные
            el.onclick = () => openModal({ 
                country: ruCountry, 
                name: s_name, 
                ip: s_ip, 
                ping: s_ping, 
                speed: s_speed
            }, flagUrl);
            
            grid.appendChild(el);
        });
    }

    function openModal(data, flagUrl) {
        const m = document.getElementById('modal');
        document.getElementById('mFlag').src = flagUrl;
        document.getElementById('mCountry').textContent = data.country;
        document.getElementById('mName').textContent = data.name;
        
        // Применяем хакерскую маску к IP-адресу
        document.getElementById('mIP').textContent = obfuscateIP(data.ip);
        
        document.getElementById('mPing').textContent = (data.ping > 0 ? data.ping : '---') + " ms";
        document.getElementById('mSpeed').textContent = (data.speed > 0 ? data.speed + " Мбит/с" : "---");
        
        // Дефолтное мощное шифрование для технологичного вида
        document.getElementById('mProto').textContent = "AES-256"; 
        
        m.classList.add('open');
    }
    
    function closeModal(e) { if(e.target.id === 'modal') forceCloseModal(); }
    function forceCloseModal() { document.getElementById('modal').classList.remove('open'); }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') forceCloseModal(); });

    function openBot() { window.location.href = "https://t.me/fl1pvpnbot"; } 

    init();
</script>
</body>
</html>
