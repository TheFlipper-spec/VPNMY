<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FL1PVPN SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #020205; /* Чуть темнее для контраста с фоном */
            --bg-card: rgba(20, 20, 25, 0.6);
            --bg-card-hover: rgba(30, 30, 40, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            
            --primary: #6366f1;
            --accent: #00f3ff;
            
            --text-main: #ffffff;
            --text-muted: #888888;
            
            --success: #00ff9d;
            --warning: #ffcc00;
            --danger: #ff0055;
            
            --radius-lg: 16px;
            
            --font-ui: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ВЕРНУЛ ФОН --- */
        #bg-canvas {
            position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 0; pointer-events: none;
            /* Добавил легкий блюр для глубины */
            filter: blur(1px);
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 51%);
            background-size: 100% 4px;
            pointer-events: none; z-index: 10;
        }
        
        .container {
            width: 100%; max-width: 600px;
            padding: 24px 20px 100px;
            z-index: 20; position: relative;
        }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin: 20px 0 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .brand { display: flex; flex-direction: column; gap: 4px; }
        
        .logo {
            font-size: 28px; font-weight: 800; letter-spacing: -1px;
            color: #fff; text-transform: uppercase;
            display: flex; align-items: center; gap: 12px;
            font-family: var(--font-code);
        }
        
        /* --- ВЕРНУЛ ЭФФЕКТ ТЕКСТА --- */
        .hacker-text {
            position: relative;
        }
        
        .status-dot {
            width: 8px; height: 8px; background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse-dot 2s infinite;
        }
        
        .subtitle {
            font-size: 10px; color: var(--text-muted); 
            font-family: var(--font-code); text-transform: uppercase; letter-spacing: 1px;
            line-height: 1.4;
        }

        /* Filters */
        .filters {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 4px; margin: 0 -4px 24px;
            scrollbar-width: none;
        }
        .filters::-webkit-scrollbar { display: none; }

        .chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px; border-radius: 40px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            cursor: pointer; transition: 0.3s;
            font-family: var(--font-code);
        }
        .chip:hover { border-color: var(--accent); color: #fff; }
        .chip.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }

        /* Grid */
        .grid { display: flex; flex-direction: column; gap: 12px; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.3s;
            position: relative; overflow: hidden;
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
        }
        
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(0, 243, 255, 0.1);
        }

        .card-left { display: flex; align-items: center; gap: 16px; }

        .flag-icon { 
            width: 38px; height: 28px; 
            border-radius: 4px;
            object-fit: cover;
            background: #111;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .info h3 {
            margin: 0; font-size: 15px; font-weight: 700;
            color: #fff; font-family: var(--font-ui);
            margin-bottom: 4px;
        }
        
        .badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px;
            font-family: var(--font-code); border: 1px solid transparent;
        }
        /* Badge Colors */
        .b-game { color: #34d399; border-color: rgba(52, 211, 153, 0.3); background: rgba(52, 211, 153, 0.1); }
        .b-warp { color: #60a5fa; border-color: rgba(96, 165, 250, 0.3); background: rgba(96, 165, 250, 0.1); }
        .b-white { color: #f87171; border-color: rgba(248, 113, 113, 0.3); background: rgba(248, 113, 113, 0.1); }
        .b-univ { color: #818cf8; border-color: rgba(129, 140, 248, 0.3); background: rgba(129, 140, 248, 0.1); }
        .b-proto { color: #aaa; border-color: rgba(255, 255, 255, 0.1); }

        .stats {
            text-align: right;
            display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
        }
        .ping-val {
            font-weight: 700; font-size: 14px; color: #fff;
            font-family: var(--font-code);
            display: flex; align-items: center; gap: 6px;
        }
        .type-val { font-size: 10px; color: var(--text-muted); font-family: var(--font-code); text-transform: uppercase; }

        .signal-dot {
            width: 6px; height: 6px; border-radius: 50%;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(12px);
            opacity: 0; pointer-events: none; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: #0f0f11;
            width: 90%; max-width: 400px;
            border-radius: 24px; padding: 24px;
            border: 1px solid var(--border-color);
            transform: scale(0.95); transition: 0.3s;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.15);
        }
        .modal-overlay.open .modal { transform: scale(1); }

        .modal-header { text-align: center; margin-bottom: 20px; }
        .m-flag { 
            width: 60px; height: auto; border-radius: 6px;
            display: block; margin: 0 auto 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .m-title { 
            font-size: 18px; font-weight: 700; margin: 0; color: #fff;
        }
        .m-sub { color: var(--accent); font-size: 12px; margin-top: 4px; font-family: var(--font-code); }

        .data-list { 
            background: rgba(255,255,255,0.03); border-radius: 12px; 
            padding: 16px; margin-bottom: 24px; 
        }
        .data-row { 
            display: flex; justify-content: space-between; 
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        .data-row:last-child { border: none; }
        .d-label { color: var(--text-muted); font-size: 12px; }
        .d-value { font-weight: 600; font-family: var(--font-code); color: #fff; font-size: 13px; }

        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            font-size: 14px; font-weight: 700; cursor: pointer;
            background: var(--primary); color: #fff; 
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); 
            font-family: var(--font-ui); text-transform: uppercase;
        }
        
        @keyframes pulse-dot { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 480px) {
            .container { padding-top: 10px; }
            .modal { position: absolute; bottom: 0; width: 100%; border-radius: 24px 24px 0 0; margin: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scanline"></div>

<div class="container">
    <header>
        <div class="brand">
            <div class="logo">
                <div class="status-dot"></div>
                <span class="hacker-text" data-value="FL1PVPN">FL1PVPN</span>
            </div>
            <div class="subtitle" id="timeInfo">INITIALIZING SYSTEM...</div>
        </div>
    </header>

    <div class="filters">
        <div class="chip active" onclick="filterData('all', this)">ALL</div>
        <div class="chip" onclick="filterData('Game Server', this)">GAME</div>
        <div class="chip" onclick="filterData('WARP', this)">WARP</div>
        <div class="chip" onclick="filterData('UNIVERSAL', this)">TURBO</div>
        <div class="chip" onclick="filterData('WHITELIST', this)">RUSSIA</div>
    </div>

    <div id="grid" class="grid"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
    <div class="modal">
        <div class="modal-header">
            <img id="mFlag" src="" class="m-flag" alt="">
            <h2 class="m-title" id="mCountry">Country</h2>
            <div class="m-sub" id="mName">SERVER NODE</div>
        </div>
        <div class="data-list">
            <div class="data-row"><span class="d-label">IP Address</span><span class="d-value" id="mIP">---</span></div>
            <div class="data-row"><span class="d-label">Ping</span><span class="d-value" id="mPing">---</span></div>
            <div class="data-row"><span class="d-label">Protocol</span><span class="d-value" id="mProto">---</span></div>
            <div class="data-row"><span class="d-label">Type</span><span class="d-value" id="mType">---</span></div>
        </div>
        <button class="btn" onclick="openBot()">GET CONFIG KEY</button>
    </div>
</div>

<script>
    // --- 1. HACKER TEXT EFFECT ---
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
    function runHackerEffect() {
        const element = document.querySelector('.hacker-text');
        const targetText = element.dataset.value;
        let iterations = 0;

        const interval = setInterval(() => {
            element.innerText = targetText.split("")
                .map((letter, index) => {
                    if(index < iterations) return targetText[index];
                    return letters[Math.floor(Math.random() * letters.length)];
                }).join("");

            if(iterations >= targetText.length) {
                clearInterval(interval);
                element.innerText = targetText; // Убеждаемся, что в конце чистый текст
            }
            iterations += 1 / 2; // Скорость расшифровки
        }, 35);
    }
    // Запускаем эффект сразу при загрузке
    runHackerEffect();


    // --- 2. DYNAMIC BACKGROUND (Starfield) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    
    // Настройки звезд
    let stars = [];
    const numStars = 150; // Количество частиц
    const speed = 2;      // Скорость полета
    const focalLength = 400; // "Глубина" сцены

    function resize() { 
        width = canvas.width = window.innerWidth; 
        height = canvas.height = window.innerHeight;
        initStars(); // Пересоздаем звезды при ресайзе
    }
    window.addEventListener('resize', resize);

    function initStars() {
        stars = [];
        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width - width / 2,
                y: Math.random() * height - height / 2,
                z: Math.random() * focalLength,
                color: Math.random() > 0.8 ? '#6366f1' : '#00f3ff' // Основные цвета темы
            });
        }
    }

    function animateBg() {
        // Заливаем фон полупрозрачным черным для эффекта "следов"
        ctx.fillStyle = "rgba(2, 2, 5, 0.2)";
        ctx.fillRect(0, 0, width, height);

        stars.forEach(s => {
            // Двигаем звезду к зрителю
            s.z -= speed;
            // Если пролетела мимо экрана, спавним заново далеко
            if (s.z <= 0) {
                s.x = Math.random() * width - width / 2;
                s.y = Math.random() * height - height / 2;
                s.z = focalLength;
            }

            // Проекция 3D координат на 2D экран
            const scale = focalLength / s.z;
            const x2d = s.x * scale + width / 2;
            const y2d = s.y * scale + height / 2;
            const size = scale * 1.5; // Чем ближе, тем больше

            // Рисуем звезду
            ctx.fillStyle = s.color;
            ctx.beginPath();
            // Используем квадраты для лучшей производительности
            ctx.fillRect(x2d, y2d, size, size); 
        });
        requestAnimationFrame(animateBg);
    }
    
    resize(); // Первая инициализация
    animateBg(); // Запуск анимации


    // --- MAIN APP LOGIC (Data Loading) ---
    const JSON_URL = "stats.json";
    let serversData = [];

    async function init() {
        try {
            const res = await fetch(JSON_URL + "?t=" + Date.now());
            if(!res.ok) throw new Error("Failed to load");
            const data = await res.json();
            
            document.getElementById('timeInfo').innerHTML = 
                `UPDATED: ${data.updated_at} <br> NEXT: ${data.next_update}`;
            
            serversData = data.servers || [];
            filterData('all', document.querySelector('.chip.active'));
            
        } catch (e) {
            document.getElementById('timeInfo').innerText = "SYSTEM OFFLINE";
            document.getElementById('grid').innerHTML = 
                `<div style="text-align:center; padding:40px; color:#ff0055; font-family:monospace">[ ERROR: UNABLE TO CONNECT TO MAINFRAME ]</div>`;
        }
    }

    function filterData(category, el) {
        if(el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }
        const list = category === 'all' ? serversData : serversData.filter(s => s.category === category);
        render(list);
    }

    function render(list) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        if(list.length === 0) {
            grid.innerHTML = `<div style="text-align:center; color:#555; margin-top:20px; font-family:monospace">// NO NODES FOUND</div>`;
            return;
        }
        list.forEach((s, i) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.style.animationDelay = (i * 0.05) + 's';
            
            const iso = s.iso ? s.iso.toLowerCase() : 'xx';
            const flagUrl = `https://flagcdn.com/w80/${iso}.png`;
            
            let pingColor = '#00ff9d';
            if(s.ping > 150) pingColor = '#ffcc00';
            if(s.ping > 300) pingColor = '#ff0055';

            let badgeClass = 'b-univ';
            if(s.category === 'Game Server') badgeClass = 'b-game';
            if(s.category === 'WARP') badgeClass = 'b-warp';
            if(s.category === 'WHITELIST') badgeClass = 'b-white';

            const typeLabel = s.type || s.protocol || 'VLESS';

            el.innerHTML = `
                <div class="card-left">
                    <img src="${flagUrl}" class="flag-icon" onerror="this.src='https://flagcdn.com/w80/xx.png'">
                    <div class="info">
                        <h3>${s.country}</h3>
                        <div class="badges">
                            <span class="badge ${badgeClass}">${s.category}</span>
                            <span class="badge b-proto">${s.protocol}</span>
                        </div>
                    </div>
                </div>
                <div class="stats">
                    <div class="ping-val">
                        ${s.ping} ms 
                        <div class="signal-dot" style="background:${pingColor}"></div>
                    </div>
                    <span class="type-val">${typeLabel}</span>
                </div>
            `;
            el.onclick = () => openModal(s, flagUrl);
            grid.appendChild(el);
        });
    }

    function openModal(s, flagUrl) {
        const m = document.getElementById('modal');
        document.getElementById('mFlag').src = flagUrl;
        document.getElementById('mCountry').innerText = s.country;
        document.getElementById('mName').innerText = s.name;
        document.getElementById('mIP').innerText = s.ip;
        document.getElementById('mPing').innerText = s.ping + " ms";
        document.getElementById('mProto').innerText = s.protocol;
        document.getElementById('mType').innerText = s.type;
        m.classList.add('open');
    }
    function closeModal(e) {
        if(e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
    }
    function openBot() {
        window.location.href = "https://t.me/fl1pvpnbot";
    }

    init();
</script>
</body>
</html>
